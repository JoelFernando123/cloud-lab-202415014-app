<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 600px;
            margin: 80px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        .data {
            margin-top: 25px;
        }

        .row {
            display: flex;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .label {
            width: 40%;
            font-weight: bold;
            color: #555;
        }

        .value {
            width: 60%;
            color: #222;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Data Mahasiswa</h1>

        <div class="data">

            <div class="row">
                <div class="label">Nama</div>
                <div class="value">Joel Fernando Situmeang</div>
            </div>

            <div class="row">
                <div class="label">NPM</div>
                <div class="value">202415014</div>
            </div>

            <div class="row">
                <div class="label">Program Studi</div>
                <div class="value">Ilmu Komputer</div>
            </div>

        </div>

        <div class="footer">
            <p>Data Mahasiswa - Program Studi Ilmu Komputer</p>
        </div>
    </div>

</body>
</html>
